name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet -e '.[dev]'
      # Tests must not touch the network; mark live-archive tests with @pytest.mark.network.
      - run: pytest -q -m "not network"
