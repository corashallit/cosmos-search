[project]
name = "cosmos-search"
version = "0.0.1"
description = "Explain every object within 100 pc"
requires-python = ">=3.11"
dependencies = ["numpy", "pyyaml", "pyrage"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cosmos_search*"]
