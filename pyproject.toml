[project]
name = "cosmos-search"
version = "0.0.1"
description = "First look at Gaia DR4 for technosignature-style anomalies"
requires-python = ">=3.11"
dependencies = ["numpy", "pyyaml", "pyrage", "requests", "pyvo", "astroquery", "astropy", "pyarrow", "pandas", "scipy", "scikit-learn", "lsdb", "numba", "healpy"]

[project.optional-dependencies]
dev = ["pytest"]
plots = ["matplotlib"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cosmos_search*"]

[tool.pytest.ini_options]
markers = ["network: needs live archive access; skipped in CI"]

[tool.setuptools.package-data]
"cosmos_search.vetting" = ["*.md"]
