[project]
name = "cosmos-search"
version = "0.0.1"
description = "First look at Gaia DR4 for technosignature-style anomalies"
requires-python = ">=3.11"
dependencies = ["numpy", "pyyaml", "pyrage", "requests", "pyvo", "astroquery", "astropy", "pyarrow"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cosmos_search*"]

[tool.pytest.ini_options]
markers = ["network: needs live archive access; skipped in CI"]
